name: Public regression

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run Agent and archive contracts
        shell: bash
        run: |
          set -euo pipefail
          node work/verify-agent-engine.cjs --run
          node work/verify-agent-ui-state.cjs --run
          node work/verify-conversation-context.cjs --run
          node work/verify-archive-streaming.cjs
          node evaluation/evaluate-routing.cjs --run
      - name: Run public regression suite
        run: npm run ci
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: outputs/ci
          retention-days: 7

  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: companion/requirements*.txt
      - name: Install companion test dependencies
        run: python -m pip install -r companion/requirements-dev.txt
      - name: Run companion contracts
        run: |
          mkdir -p outputs
          python -m pytest companion/tests -q -ra --basetemp=outputs/companion-temp --junitxml=outputs/companion-tests.xml
      - name: Evaluate synthetic retrieval
        run: python evaluation/evaluate_retrieval.py --run
      - name: Preserve companion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-results
          path: outputs/companion-tests.xml
          retention-days: 7
